<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnythingLLM 文档上传</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  p { color: #666; }
  input[type=file] { display: block; width: 100%; box-sizing: border-box; padding: 10px; border: 1px dashed #bbb; border-radius: 6px; }
  button { margin-top: 16px; padding: 9px 22px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { background: #9ca3af; cursor: default; }
  #out { margin-top: 20px; padding: 12px; border-radius: 6px; background: #f3f4f6; white-space: pre-wrap; display: none; }
  #out.ok { background: #ecfdf5; color: #065f46; }
  #out.err { background: #fef2f2; color: #991b1b; }
</style>
</head>
<body>
<h1>上传文档到第一个工作区</h1>
<p>文件会通过 POST /v1/document/upload 上传到第一个工作区，并直接完成向量化嵌入。双击本文件打开即可使用。</p>
<form id="f">
  <input id="file" type="file" required>
  <button id="btn" type="submit">上传并嵌入</button>
</form>
<div id="out"></div>
<script>
const API = "http://127.0.0.1:3001/api/v1";
const KEY = "30DRV5P-2V34VM0-JJYPFRS-6AYFT1M";
const $ = id => document.getElementById(id);

async function call(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: { Authorization: "Bearer " + KEY, ...(options.headers || {}) },
  });
  const text = await res.text();
  let data = {};
  try { data = JSON.parse(text); } catch { /* 非 JSON 错误 */ }
  if (!res.ok) {
    const msg = data.error && (data.error.message || data.error);
    throw new Error(msg || text || "HTTP " + res.status);
  }
  return data;
}

$("f").onsubmit = async e => {
  e.preventDefault();
  const out = $("out"), btn = $("btn");
  out.className = "";
  out.textContent = "上传并嵌入中，请稍候…";
  out.style.display = "block";
  btn.disabled = true;
  try {
    const { workspaces } = await call("/workspaces");
    if (!workspaces || !workspaces.length) throw new Error("没有工作区，请先在 AnythingLLM 中创建");
    const workspace = workspaces[0];

    const fd = new FormData();
    fd.append("addToWorkspaces", workspace.slug);
    fd.append("file", $("file").files[0]);
    const result = await call("/document/upload", { method: "POST", body: fd });

    const doc = (result.documents || [])[0];
    if (!doc || !doc.location) throw new Error("上传失败：" + JSON.stringify(result));
    out.className = "ok";
    out.textContent = `完成\n工作区：${workspace.name}\n文件：${doc.title || $("file").files[0].name}`;
    $("f").reset();
  } catch (err) {
    out.className = "err";
    out.textContent = "失败：" + err.message;
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
