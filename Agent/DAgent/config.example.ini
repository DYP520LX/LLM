# DAgent 配置模板
# 运行时请复制为当前项目目录下的 config.ini，并按需修改。
# 所有配置项都有内置默认值，只有需要覆盖默认行为时才必须填写。

[llm]
base_url = https://text.pollinations.ai/openai
api_key = local
model = openai
# 是否使用流式输出（推荐 true，可同时获取 Provider Token Usage）
stream = true
# 单次 LLM 请求超时（秒）
timeout = 120
# 单轮对话中允许的最大工具调用轮数
max_tool_rounds = 10
# 可选：模型的上下文窗口大小（Token）。不填时默认 128000，并在界面标注“默认”。
# 支持 128000、128k、1m 这样的写法。
# context_window = 128000

[agent]
# 可选：覆盖 DAgent 默认 System Prompt；留空使用内置提示词
system_prompt =
# 项目级说明文件；首次加载会话时注入一次，后续轮次直接复用
agents_file = AGENTS.md

[context]
# 上下文达到该比例后暂停普通提示词并要求 /compact
warning_ratio = 0.60
# 压缩摘要目标 Token 数
compaction_target_tokens = 5000
# 原始上下文归档目录（相对项目根目录）
archive_dir = .agents/context

[sessions]
# 会话历史目录（相对项目根目录）
dir = .agents/sessions

[mcp]
# MCP Server 配置文件（相对项目根目录）
config_file = .mcp.json
# .mcp.json 中未写 timeout 时的默认值（秒）
default_timeout = 30
connect_grace_seconds = 5
call_grace_seconds = 5
shutdown_grace_seconds = 8
# MCP 工具结果进入上下文前的最大字符数
max_result_chars = 30000

[tui]
# 右侧 MCP 状态栏宽度（列）
sidebar_width = 36
# /resume 列表最多显示的历史会话数量
session_list_limit = 50
# TUI 中恢复历史消息时的预览字符数
message_preview_chars = 1200

[tools]
# Runcli 单次执行超时（秒）
cli_timeout = 30
# Runcli 的 stdout/stderr 各自最多返回的字符数
cli_max_stream_chars = 6000
# fetch_web 请求超时（秒）
web_timeout = 20
# fetch_web 默认返回正文长度，以及模型可请求的上限
web_default_max_chars = 12000
web_max_chars = 50000
# searchweb 请求超时（秒）
search_timeout = 20
# searchweb 默认返回条数，以及模型可请求的上限
search_default_top_k = 5
search_max_top_k = 10
# 每条搜索结果的摘要最大字符数
search_max_snippet_chars = 400

[search]
# 百度千帆百度搜索 API Key，用于 searchweb 工具
# 获取方式：https://cloud.baidu.com/doc/qianfan-api/s/Wmbq4z7e5
baidu_qianfan_api_key =
